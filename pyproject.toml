[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfcraft-cli"
version = "1.0.0"
description = "Offline-first PDF toolkit for merging, splitting, extracting, rotating, encrypting, inspecting, and watermarking PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
dependencies = ["pypdf>=5.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
pdfcraft = "pdfcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
